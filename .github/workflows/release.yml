name: release

# Attaches standalone binaries to a release. bun cross-compiles every target
# from one Linux runner, so this needs no macOS runner and no build matrix.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to
        required: true

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The version is compiled into the binary from package.json, so a tag that
      # disagrees with it would ship binaries that misreport `--version`.
      - name: Check the tag matches package.json
        run: |
          pkg=$(bun -p "require('./package.json').version")
          if [ "${TAG#v}" != "$pkg" ]; then
            echo "::error::tag $TAG does not match package.json version $pkg — bump the version or retag"
            exit 1
          fi

      - run: bun run typecheck
      - run: bun run test

      - name: Build binaries
        run: |
          mkdir -p out
          version=$(bun -p "require('./package.json').version")
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build src/web-entry.ts --compile --target="bun-$target" \
              --define __VERSION__="\"$version\"" --outfile out/ports
            tar -czf "out/ports-$target.tar.gz" -C out ports
            rm out/ports
          done
          sha256sum out/*.tar.gz > out/checksums.txt

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/*.tar.gz out/checksums.txt --clobber
